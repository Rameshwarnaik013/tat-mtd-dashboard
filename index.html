<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAT & MTD Dashboard</title>
<style>
*,*::before,*::after { box-sizing: border-box; }
html,body { margin: 0; padding: 0; height: 100%; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1c2833; background: #f5f7fa; line-height: 1.5; }
button { font-family: inherit; cursor: pointer; }
input,select { font-family: inherit; }

#upload { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: #fff; }
.drop-zone {
  max-width: 640px; width: 100%;
  padding: 80px 40px;
  text-align: center;
  border: 2px dashed #d0d7de;
  border-radius: 16px;
  cursor: pointer;
  transition: all 0.2s;
  background: #fafbfc;
}
.drop-zone:hover, .drop-zone.dragover {
  border-color: #f5b342;
  background: #fff8e8;
}
.folder-icon {
  font-size: 64px;
  line-height: 1;
  margin-bottom: 24px;
  display: inline-block;
}
.drop-zone .main-text {
  font-size: 1.4rem;
  color: #4a5568;
  font-weight: 400;
  margin-bottom: 8px;
}
.drop-zone .sub-text {
  font-size: 1rem;
  color: #94a3b8;
  margin-top: 4px;
}
.drop-zone.dragover .main-text { color: #d97706; }

#dashboard.hidden { display: none; }
#dashboard { display: flex; flex-direction: column; height: 100vh; }
.app-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; background: white; border-bottom: 1px solid #e8eef5; flex-shrink: 0; }
.app-header h1 { font-size: 1.2rem; color: #0a2647; font-weight: 700; }
.btn-reset { background: #f5f7fa; color: #0a2647; border: 1px solid #d0d7de; padding: 6px 14px; border-radius: 6px; font-size: 0.85rem; font-weight: 500; }
.btn-reset:hover { background: #e8eef5; }

.layout { display: flex; flex: 1; overflow: hidden; }
.sidebar { width: 290px; background: white; border-right: 1px solid #e8eef5; overflow-y: auto; padding: 16px; flex-shrink: 0; }
.sidebar h2 { font-size: 1rem; font-weight: 700; color: #0a2647; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid #0a2647; }
.main-content { flex: 1; overflow-y: auto; padding: 20px; }

.filter-group { margin-bottom: 10px; border: 1px solid #e8eef5; border-radius: 8px; overflow: hidden; background: white; }
.filter-header { padding: 10px 12px; background: #f5f7fa; display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; font-size: 0.86rem; font-weight: 600; color: #0a2647; }
.count-badge { font-size: 0.72rem; background: #0a2647; color: white; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
.filter-body { padding: 10px 12px; border-top: 1px solid #e8eef5; }
.filter-body input.search { width: 100%; padding: 6px 10px; border: 1px solid #d0d7de; border-radius: 4px; font-size: 0.85rem; margin-bottom: 8px; }
.filter-actions { display: flex; gap: 6px; margin-bottom: 8px; }
.filter-actions button { flex: 1; padding: 5px 10px; background: #f5f7fa; border: 1px solid #d0d7de; border-radius: 4px; font-size: 0.78rem; font-weight: 600; color: #0a2647; }
.filter-actions button:hover { background: #e8eef5; }
.filter-list { max-height: 180px; overflow-y: auto; border: 1px solid #e8eef5; border-radius: 4px; padding: 4px; }
.filter-list label { display: flex; align-items: center; gap: 6px; padding: 4px 6px; font-size: 0.82rem; cursor: pointer; border-radius: 3px; }
.filter-list label:hover { background: #f5f7fa; }
.filter-list input[type="checkbox"] { margin: 0; cursor: pointer; }

.date-presets { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.date-presets button { padding: 4px 8px; font-size: 0.74rem; background: #f5f7fa; border: 1px solid #d0d7de; border-radius: 4px; color: #0a2647; }
.date-presets button.active { background: #0a2647; color: white; border-color: #0a2647; }
.date-range { display: flex; gap: 6px; }
.date-range input { flex: 1; padding: 5px 8px; border: 1px solid #d0d7de; border-radius: 4px; font-size: 0.8rem; }

.parent-tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 2px solid #0a2647; overflow-x: auto; }
.parent-tabs button { padding: 12px 18px; background: #f0f3f7; border: 0; font-size: 0.9rem; font-weight: 700; color: #0a2647; border-radius: 6px 6px 0 0; letter-spacing: 0.3px; white-space: nowrap; flex-shrink: 0; }
.parent-tabs button.active { background: #0a2647; color: white; }

.sub-tabs { display: flex; gap: 2px; margin-bottom: 12px; border-bottom: 1px solid #e8eef5; overflow-x: auto; }
.sub-tabs button { padding: 8px 14px; background: transparent; border: 0; font-size: 0.85rem; color: #555; border-radius: 4px 4px 0 0; white-space: nowrap; }
.sub-tabs button.active { background: #f0f3f7; color: #0a2647; font-weight: 600; border-bottom: 2px solid #0a2647; }

.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi-card { background: white; padding: 12px 16px; border-radius: 8px; border: 1px solid #e8eef5; border-left: 4px solid #0a2647; }
.kpi-card .label { font-size: 0.74rem; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
.kpi-card .value { font-size: 1.25rem; font-weight: 700; color: #0a2647; margin-top: 4px; }

.section h3 { font-size: 1.05rem; color: #0a2647; font-weight: 700; margin-bottom: 12px; }
.table-wrap { overflow-x: auto; background: white; border-radius: 8px; border: 1px solid #e8eef5; margin-bottom: 16px; max-height: 600px; }
table.pivot { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
table.pivot thead th { background: #0a2647; color: white; font-weight: 900; font-size: 0.85rem; text-align: center; padding: 12px 14px; border: 2px solid #052238; text-transform: uppercase; letter-spacing: 0.3px; white-space: nowrap; position: sticky; top: 0; z-index: 2; }
table.pivot tbody th { background: #1a5276; color: white; font-weight: 700; text-align: left; padding: 9px 12px; border: 1px solid #0a2647; white-space: nowrap; position: sticky; left: 0; z-index: 1; }
table.pivot tbody td { padding: 8px 14px; border: 1px solid #d0d7de; text-align: center; }
table.pivot tbody tr.grand-total th, table.pivot tbody tr.grand-total td { background: #cfe2ff !important; color: #0a2647 !important; font-weight: 700; }
table.pivot tbody td.gt-col { background: #e7f0ff; font-weight: 600; }
table.pivot tbody td.pct-low { background-color: #d5f5e3; }
table.pivot tbody td.pct-mid { background-color: #fdebd0; }
table.pivot tbody td.pct-hi { background-color: #f5b7b1; }

.chart-wrap { background: white; border-radius: 8px; border: 1px solid #e8eef5; padding: 16px; margin-bottom: 16px; height: 360px; position: relative; }

.drill-down { background: white; border-radius: 8px; border: 1px solid #e8eef5; padding: 16px; margin-bottom: 16px; }
.drill-down h4 { font-size: 1rem; color: #0a2647; font-weight: 700; margin-bottom: 12px; }
.drill-down select { padding: 6px 10px; border: 1px solid #d0d7de; border-radius: 4px; font-size: 0.88rem; margin-bottom: 12px; min-width: 260px; }

.export-row { margin-top: 24px; padding-top: 16px; border-top: 1px solid #e8eef5; }
.btn-export { background: #0a2647; color: white; border: 0; padding: 12px 24px; border-radius: 6px; font-size: 0.95rem; font-weight: 600; }
.btn-export:hover { background: #1a3a6b; }
.btn-export:disabled { opacity: 0.6; cursor: wait; }

.filter-summary { margin-top: 16px; padding-top: 12px; border-top: 1px solid #e8eef5; font-size: 0.75rem; color: #6b7280; text-align: center; line-height: 1.6; }
.filter-summary .big { font-size: 1.4rem; color: #0a2647; font-weight: 700; display: block; margin-bottom: 2px; }

.warning { background: #fff3cd; border: 1px solid #ffeaa7; color: #856404; padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; }
.spinner-sm { display: inline-block; width: 16px; height: 16px; border: 2px solid #e8eef5; border-top-color: #0a2647; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }

#parse-status {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: white; padding: 24px 32px; border-radius: 12px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.15); display: none;
  z-index: 9999; text-align: center; min-width: 240px;
}
#parse-status.show { display: block; }
#parse-status .spinner-lg { display: inline-block; width: 32px; height: 32px; border: 3px solid #e8eef5; border-top-color: #0a2647; border-radius: 50%; animation: spin 0.7s linear infinite; margin-bottom: 12px; }

@media (max-width: 768px) {
  .layout { flex-direction: column; }
  .sidebar { width: 100%; max-height: 45vh; border-right: 0; border-bottom: 1px solid #e8eef5; }
  .drop-zone { padding: 56px 24px; }
  .folder-icon { font-size: 48px; }
  .drop-zone .main-text { font-size: 1.1rem; }
}
</style>
</head>
<body>

<div id="upload">
  <div class="drop-zone" id="drop-zone">
    <div class="folder-icon">📁</div>
    <div class="main-text">Click to upload or drag &amp; drop your TAT Excel file</div>
    <div class="sub-text">.xlsx / .xls / .csv</div>
    <input type="file" id="file" accept=".csv,.xlsx,.xls" hidden>
  </div>
</div>

<div id="parse-status">
  <div class="spinner-lg"></div>
  <div id="parse-msg">Parsing file...</div>
</div>

<div id="dashboard" class="hidden">
  <header class="app-header">
    <h1>TAT &amp; MTD Dashboard</h1>
    <button class="btn-reset" id="reload">Upload Different File</button>
  </header>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content" id="main"></main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
<script>
'use strict';

const DISPATCH_CATS = ['0-2 Days','3-5 Days','>5 Days'];
const DELIVERY_CATS = ['0-9 Days','10-12 Days','>12 Days','Delivery Pending'];
const DISPATCH_COLORS = {'0-2 Days':'#27ae60','3-5 Days':'#f39c12','>5 Days':'#e74c3c'};
const DELIVERY_COLORS = {'0-9 Days':'#27ae60','10-12 Days':'#f39c12','>12 Days':'#e74c3c','Delivery Pending':'#7f8c8d'};
const REQUIRED = ['Invoice Date','New MIS Item Group','Sales_Channel','From Warehouse','Customer'];

const state = {
  rows: [],
  filters: {
    startDate: null, endDate: null, minDate: null, maxDate: null,
    datePreset: 'all',
    warehouses: new Set(), items: new Set(), channels: new Set(), customers: new Set(),
    searches: { wh: '', item: '', ch: '', cust: '' },
  },
  options: { warehouses: [], items: [], channels: [], customers: [] },
  activeTab: 'dispatch',
  activeSubTab: { dispatch: 'date', delivery: 'date' },
  expanded: { wh: false, item: false, ch: false, cust: false, date: true },
  drillCh: { dispatch: null, delivery: null },
  charts: {},
};

const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function formatIndian(n) {
  n = Math.round(Number(n) || 0);
  const sign = n < 0 ? '-' : ''; n = Math.abs(n);
  const s = String(n);
  if (s.length <= 3) return sign + s;
  const last3 = s.slice(-3);
  let rest = s.slice(0, -3);
  const parts = [];
  while (rest.length > 2) { parts.unshift(rest.slice(-2)); rest = rest.slice(0, -2); }
  if (rest) parts.unshift(rest);
  return sign + parts.join(',') + ',' + last3;
}

function formatDate(d) {
  const y = d.getFullYear(); const m = String(d.getMonth()+1).padStart(2,'0'); const dd = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}

function parseExcelDate(v) {
  if (v == null || v === '') return null;
  if (v instanceof Date) return v;
  if (typeof v === 'number') { return new Date(Date.UTC(1899, 11, 30) + v * 86400000); }
  const d = new Date(v);
  return isNaN(d.getTime()) ? null : d;
}

function showParseStatus(msg) {
  $('#parse-msg').textContent = msg;
  $('#parse-status').classList.add('show');
}
function hideParseStatus() { $('#parse-status').classList.remove('show'); }

async function handleFile(file) {
  showParseStatus('Reading file...');
  await new Promise(r => setTimeout(r, 50));
  try {
    const buf = await file.arrayBuffer();
    showParseStatus('Parsing rows...');
    await new Promise(r => setTimeout(r, 50));
    const wb = XLSX.read(buf, { type: 'array', cellDates: true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const data = XLSX.utils.sheet_to_json(ws, { defval: null });
    if (!data.length) { hideParseStatus(); alert('The file appears to be empty.'); return; }
    const missing = REQUIRED.filter(c => !(c in data[0]));
    if (missing.length) { hideParseStatus(); alert('Missing required columns: ' + missing.join(', ')); return; }
    state.rows = data;
    showParseStatus('Computing metrics...');
    await new Promise(r => setTimeout(r, 50));
    preprocess();
    computeOptions();
    initFilters();
    showDashboard();
    render();
    hideParseStatus();
  } catch (e) {
    hideParseStatus();
    alert('Failed to parse file: ' + e.message);
    console.error(e);
  }
}

function preprocess() {
  for (const r of state.rows) {
    r._date = parseExcelDate(r['Invoice Date']);
    if (r._date) r._dateStr = formatDate(r._date);

    // Effective pickup date: fall back to Invoice Date when Pickedup_Date is empty
    const pickup = parseExcelDate(r['Pickedup_Date']) || r._date;
    r._pickup = pickup;

    // Recalculate Dis Days = (effective pickup - Sales Order Date) in days
    const salesOrder = parseExcelDate(r['Sales Order Date']);
    if (pickup && salesOrder) {
      const days = Math.max(0, Math.round((pickup - salesOrder) / 86400000));
      r['Dis Days'] = days;
      r['Dis TAT'] = days <= 2 ? '0-2 Days' : days <= 5 ? '3-5 Days' : '>5 Days';
    } else if (!r['Dis TAT'] || !String(r['Dis TAT']).trim()) {
      const d = Number(r['Dis Days']);
      if (Number.isFinite(d)) r['Dis TAT'] = d <= 2 ? '0-2 Days' : d <= 5 ? '3-5 Days' : '>5 Days';
    }

    // Recalculate Delivery Days = (Delivered Date - effective pickup) in days
    const delivered = parseExcelDate(r['Delivered Date']);
    if (delivered && pickup) {
      const days = Math.max(0, Math.round((delivered - pickup) / 86400000));
      r['Delivery Days'] = days;
      r['Delivery TAT'] = days <= 9 ? '0-9 Days' : days <= 12 ? '10-12 Days' : '>12 Days';
    } else if (!delivered) {
      r['Delivery TAT'] = 'Delivery Pending';
    } else if (!r['Delivery TAT'] || !String(r['Delivery TAT']).trim()) {
      const d = Number(r['Delivery Days']);
      if (Number.isFinite(d)) r['Delivery TAT'] = d <= 9 ? '0-9 Days' : d <= 12 ? '10-12 Days' : '>12 Days';
      else r['Delivery TAT'] = 'Delivery Pending';
    }
  }
  const dates = state.rows.filter(r => r._date).map(r => r._date.getTime());
  if (dates.length) {
    state.filters.minDate = new Date(Math.min(...dates));
    state.filters.maxDate = new Date(Math.max(...dates));
    state.filters.startDate = state.filters.minDate;
    state.filters.endDate = state.filters.maxDate;
  }
}

function computeOptions() {
  const wh = new Set(), it = new Set(), ch = new Set();
  for (const r of state.rows) {
    if (r['From Warehouse']) wh.add(String(r['From Warehouse']));
    if (r['New MIS Item Group']) it.add(String(r['New MIS Item Group']));
    if (r['Sales_Channel']) ch.add(String(r['Sales_Channel']));
  }
  state.options.warehouses = [...wh].sort();
  state.options.items = [...it].sort();
  state.options.channels = [...ch].sort();
  recomputeCustomers();
}

function recomputeCustomers() {
  const cs = new Set();
  const sel = state.filters.channels;
  const all = sel.size === state.options.channels.length || sel.size === 0;
  for (const r of state.rows) {
    if (!r['Customer']) continue;
    if (all || sel.has(String(r['Sales_Channel']))) cs.add(String(r['Customer']));
  }
  state.options.customers = [...cs].sort();
  for (const c of [...state.filters.customers]) if (!cs.has(c)) state.filters.customers.delete(c);
}

function initFilters() {
  state.filters.warehouses = new Set(state.options.warehouses);
  state.filters.items = new Set(state.options.items);
  state.filters.channels = new Set(state.options.channels);
  recomputeCustomers();
  state.filters.customers = new Set(state.options.customers);
}

function getFiltered() {
  const f = state.filters;
  return state.rows.filter(r => {
    if (!r._date) return false;
    if (f.startDate && r._date < f.startDate) return false;
    if (f.endDate) {
      const ed = new Date(f.endDate); ed.setHours(23,59,59,999);
      if (r._date > ed) return false;
    }
    if (!f.warehouses.has(String(r['From Warehouse']))) return false;
    if (!f.items.has(String(r['New MIS Item Group']))) return false;
    if (!f.channels.has(String(r['Sales_Channel']))) return false;
    if (!f.customers.has(String(r['Customer']))) return false;
    return true;
  });
}

function buildPctPivot(data, groupKey, tatKey, categories) {
  const valid = data.filter(r => r[tatKey] && String(r[tatKey]).trim());
  const counts = {};
  for (const r of valid) {
    const g = String(r[groupKey] ?? '(blank)');
    const t = String(r[tatKey]);
    if (!counts[g]) counts[g] = {};
    counts[g][t] = (counts[g][t] || 0) + 1;
  }
  const keys = Object.keys(counts).sort();
  const rows = keys.map(key => {
    const c = {}; let total = 0;
    for (const cat of categories) { c[cat] = counts[key][cat] || 0; total += c[cat]; }
    const pct = {};
    for (const cat of categories) pct[cat] = total > 0 ? Math.round(c[cat]/total*100) : 0;
    return { key, counts: c, pct };
  });
  const gc = {}, gpct = {}; let gTotal = 0;
  for (const cat of categories) { gc[cat] = rows.reduce((s, r) => s + r.counts[cat], 0); gTotal += gc[cat]; }
  for (const cat of categories) gpct[cat] = gTotal > 0 ? Math.round(gc[cat]/gTotal*100) : 0;
  return { categories, rows, grandTotal: { key: 'Grand Total', counts: gc, pct: gpct } };
}

function buildSumSingle(data, groupKey, valueKey) {
  const sums = {};
  for (const r of data) {
    const g = String(r[groupKey] ?? '(blank)');
    sums[g] = (sums[g] || 0) + (Number(r[valueKey]) || 0);
  }
  const entries = Object.entries(sums).sort((a, b) => b[1] - a[1]);
  const rows = entries.map(([key, value]) => ({ key, value }));
  const total = rows.reduce((s, r) => s + r.value, 0);
  return { rows, total };
}

function buildSumCross(data, rowKey, colKey, valueKey) {
  const matrix = {}, colSet = new Set();
  for (const r of data) {
    const row = String(r[rowKey] ?? '(blank)');
    const col = String(r[colKey] ?? '(blank)');
    if (!matrix[row]) matrix[row] = {};
    matrix[row][col] = (matrix[row][col] || 0) + (Number(r[valueKey]) || 0);
    colSet.add(col);
  }
  const colTotals = {};
  for (const c of colSet) colTotals[c] = Object.values(matrix).reduce((s, m) => s + (m[c] || 0), 0);
  const cols = [...colSet].sort((a, b) => colTotals[b] - colTotals[a]);
  const rowKeys = Object.keys(matrix).sort();
  const rows = rowKeys.map(rk => {
    const values = {}; let rowTotal = 0;
    for (const c of cols) { values[c] = matrix[rk][c] || 0; rowTotal += values[c]; }
    values['Grand Total'] = rowTotal;
    return { key: rk, values };
  });
  const gtValues = {}; let grandTotal = 0;
  for (const c of cols) { gtValues[c] = colTotals[c]; grandTotal += colTotals[c]; }
  gtValues['Grand Total'] = grandTotal;
  return { cols: [...cols, 'Grand Total'], rows, grandTotal: { key: 'Grand Total', values: gtValues } };
}

function showDashboard() { $('#upload').style.display = 'none'; $('#dashboard').classList.remove('hidden'); }
function showUpload() { $('#upload').style.display = 'flex'; $('#dashboard').classList.add('hidden'); }

function render() { renderSidebar(); renderMain(); }

function renderSidebar() {
  const f = state.filters, fdf = getFiltered();
  let html = `<h2>Filters</h2>
    <button class="btn-reset" style="width:100%; margin-bottom:12px;" id="reset-filters">Reset All Filters</button>`;
  html += renderDateFilter();
  html += renderMultiFilter('wh', 'From Warehouse', state.options.warehouses, f.warehouses);
  html += renderMultiFilter('item', 'MIS Item Group', state.options.items, f.items);
  html += renderMultiFilter('ch', 'Sales Channel', state.options.channels, f.channels);
  html += renderMultiFilter('cust', 'Customer', state.options.customers, f.customers);
  html += `<div class="filter-summary">
    <span class="big">${fdf.length.toLocaleString()}</span>Filtered Rows
    <div style="margin-top:6px;">WH ${f.warehouses.size}/${state.options.warehouses.length} · Item ${f.items.size}/${state.options.items.length} · Ch ${f.channels.size}/${state.options.channels.length} · Cust ${f.customers.size}/${state.options.customers.length}</div>
  </div>`;
  $('#sidebar').innerHTML = html;
  attachSidebarListeners();
}

function renderDateFilter() {
  const f = state.filters, expanded = state.expanded.date;
  const presets = [['all','All'],['mtd','MTD'],['7d','7d'],['15d','15d'],['30d','30d'],['custom','Custom']];
  return `<div class="filter-group">
    <div class="filter-header" data-toggle="date"><span>Invoice Date Range</span><span class="count-badge">${expanded?'▾':'▸'}</span></div>
    ${expanded ? `<div class="filter-body">
      <div class="date-presets">${presets.map(([k,l]) => `<button data-preset="${k}" class="${f.datePreset === k ? 'active':''}">${l}</button>`).join('')}</div>
      <div class="date-range">
        <input type="date" id="date-start" value="${f.startDate?formatDate(f.startDate):''}" min="${f.minDate?formatDate(f.minDate):''}" max="${f.maxDate?formatDate(f.maxDate):''}">
        <input type="date" id="date-end" value="${f.endDate?formatDate(f.endDate):''}" min="${f.minDate?formatDate(f.minDate):''}" max="${f.maxDate?formatDate(f.maxDate):''}">
      </div>
    </div>` : ''}
  </div>`;
}

function renderMultiFilter(key, label, allOptions, selected) {
  const expanded = state.expanded[key], search = state.filters.searches[key] || '';
  const q = search.toLowerCase().trim();
  const visible = q ? allOptions.filter(o => o.toLowerCase().includes(q) || selected.has(o)) : allOptions;
  const n = selected.size, total = allOptions.length;
  const badge = n === total && total > 0 ? `All ${total}` : `${n}/${total}`;
  const listHtml = visible.length === 0
    ? '<div style="padding:8px;color:#888;font-size:0.82rem;">No matches</div>'
    : visible.map(o => `<label><input type="checkbox" data-filter="${key}" value="${esc(o)}" ${selected.has(o)?'checked':''}><span>${esc(o)}</span></label>`).join('');
  return `<div class="filter-group">
    <div class="filter-header" data-toggle="${key}"><span>${esc(label)}</span><span class="count-badge">${badge}</span></div>
    ${expanded ? `<div class="filter-body">
      <input type="text" class="search" placeholder="Search ${label.toLowerCase()}..." data-search="${key}" value="${esc(search)}">
      <div class="filter-actions">
        <button data-action="all" data-filter-key="${key}">All</button>
        <button data-action="none" data-filter-key="${key}">None</button>
      </div>
      <div class="filter-list">${listHtml}</div>
    </div>` : ''}
  </div>`;
}

const SET_KEY = { wh: 'warehouses', item: 'items', ch: 'channels', cust: 'customers' };

function attachSidebarListeners() {
  document.querySelectorAll('[data-toggle]').forEach(el => {
    el.onclick = () => { const k = el.dataset.toggle; state.expanded[k] = !state.expanded[k]; renderSidebar(); };
  });
  document.querySelectorAll('[data-preset]').forEach(el => {
    el.onclick = () => applyDatePreset(el.dataset.preset);
  });
  const ds = $('#date-start'), de = $('#date-end');
  if (ds) ds.onchange = () => { state.filters.startDate = ds.value ? new Date(ds.value) : null; state.filters.datePreset = 'custom'; render(); };
  if (de) de.onchange = () => { state.filters.endDate = de.value ? new Date(de.value) : null; state.filters.datePreset = 'custom'; render(); };
  document.querySelectorAll('[data-search]').forEach(el => {
    el.oninput = () => {
      state.filters.searches[el.dataset.search] = el.value;
      renderSidebar();
      setTimeout(() => { const n = document.querySelector(`[data-search="${el.dataset.search}"]`); if (n) { n.focus(); n.setSelectionRange(el.value.length, el.value.length); } }, 0);
    };
  });
  document.querySelectorAll('[data-action]').forEach(el => {
    el.onclick = () => {
      const a = el.dataset.action, k = el.dataset.filterKey, sk = SET_KEY[k];
      state.filters[sk] = a === 'all' ? new Set(state.options[sk]) : new Set();
      if (k === 'ch') { recomputeCustomers(); }
      render();
    };
  });
  document.querySelectorAll('input[data-filter]').forEach(el => {
    el.onchange = () => {
      const k = el.dataset.filter, v = el.value, sk = SET_KEY[k];
      if (el.checked) state.filters[sk].add(v); else state.filters[sk].delete(v);
      if (k === 'ch') { recomputeCustomers(); }
      render();
    };
  });
  const ra = $('#reset-filters');
  if (ra) ra.onclick = () => {
    initFilters();
    state.filters.startDate = state.filters.minDate;
    state.filters.endDate = state.filters.maxDate;
    state.filters.datePreset = 'all';
    state.filters.searches = { wh: '', item: '', ch: '', cust: '' };
    render();
  };
}

function applyDatePreset(preset) {
  const f = state.filters, min = f.minDate, max = f.maxDate;
  const today = new Date(); today.setHours(0,0,0,0);
  f.datePreset = preset;
  if (preset === 'all') { f.startDate = min; f.endDate = max; }
  else if (preset === 'mtd') {
    const first = new Date(today.getFullYear(), today.getMonth(), 1);
    f.startDate = first < min ? min : first;
    f.endDate = today > max ? max : today;
  } else if (['7d','15d','30d'].includes(preset)) {
    const days = preset === '7d' ? 6 : preset === '15d' ? 14 : 29;
    const start = new Date(max); start.setDate(start.getDate() - days);
    f.startDate = start < min ? min : start; f.endDate = max;
  }
  render();
}

function renderMain() {
  const tabs = [['dispatch','DISPATCH TAT'],['delivery','DELIVERY TAT'],['mtd-wh','MTD DISPATCH'],['mtd-ch','MTD SALES CHANNEL'],['mtd-inv','MTD SALE INVOICE']];
  $('#main').innerHTML = `<nav class="parent-tabs">${tabs.map(([k,l]) => `<button data-tab="${k}" class="${state.activeTab===k?'active':''}">${l}</button>`).join('')}</nav>
    <div id="tab-content"></div>
    <div class="export-row"><button class="btn-export" id="btn-export">Download All Pivots (Excel)</button></div>`;
  document.querySelectorAll('[data-tab]').forEach(el => { el.onclick = () => { state.activeTab = el.dataset.tab; renderMain(); }; });
  $('#btn-export').onclick = exportExcel;
  renderTabContent();
}

function renderTabContent() {
  const fdf = getFiltered();
  if (fdf.length === 0) { $('#tab-content').innerHTML = '<div class="warning">No data matches the selected filters.</div>'; return; }
  for (const id in state.charts) { try { state.charts[id].destroy(); } catch (e) {} }
  state.charts = {};
  if (state.activeTab === 'dispatch') renderTat(fdf, 'Dis TAT', 'Dispatch TAT', DISPATCH_CATS, DISPATCH_COLORS, 'dispatch');
  else if (state.activeTab === 'delivery') renderTat(fdf, 'Delivery TAT', 'Delivery TAT', DELIVERY_CATS, DELIVERY_COLORS, 'delivery');
  else if (state.activeTab === 'mtd-wh') renderMtdWh(fdf);
  else if (state.activeTab === 'mtd-ch') renderMtdCross(fdf, 'Sales_Channel', 'Sales Channel');
  else if (state.activeTab === 'mtd-inv') renderMtdCross(fdf, '_dateStr', 'Invoice Date');
}

function renderTat(fdf, tatKey, label, cats, colors, pfx) {
  const valid = fdf.filter(r => r[tatKey] && String(r[tatKey]).trim());
  const tc = {}; for (const r of valid) tc[r[tatKey]] = (tc[r[tatKey]]||0) + 1;
  let kpiHtml = `<div class="kpi-row">
    <div class="kpi-card"><div class="label">Total Lines</div><div class="value">${fdf.length.toLocaleString()}</div></div>
    ${cats.map(c => {
      const cnt = tc[c]||0, pct = valid.length>0 ? Math.round(cnt/valid.length*100) : 0;
      return `<div class="kpi-card" style="border-left-color:${colors[c]}"><div class="label">${esc(c)}</div><div class="value">${cnt.toLocaleString()} (${pct}%)</div></div>`;
    }).join('')}</div>`;

  const subs = [['date','Invoice Date'],['item','MIS Item Group'],['channel','Sales Channel'],['warehouse','From Warehouse']];
  const sub = state.activeSubTab[pfx];
  let subHtml = `<nav class="sub-tabs">${subs.map(([k,l]) => `<button data-subtab="${k}" data-pfx="${pfx}" class="${sub===k?'active':''}">${l}</button>`).join('')}</nav>`;
  const subCol = sub==='date' ? '_dateStr' : sub==='item' ? 'New MIS Item Group' : sub==='channel' ? 'Sales_Channel' : 'From Warehouse';
  const subLabel = subs.find(s => s[0]===sub)[1];
  const pivot = buildPctPivot(fdf, subCol, tatKey, cats);

  let contentHtml = `<div class="section"><h3>${esc(label)} by ${esc(subLabel)}</h3>${renderPctTable(pivot)}<div class="chart-wrap"><canvas id="chart-${pfx}"></canvas></div></div>`;

  let drillPivot = null, drillCh = null;
  if (sub === 'channel') {
    const channels = [...new Set(fdf.map(r => r['Sales_Channel']).filter(Boolean))].sort();
    if (channels.length > 0) {
      drillCh = state.drillCh[pfx] || channels[0];
      if (!channels.includes(drillCh)) drillCh = channels[0];
      state.drillCh[pfx] = drillCh;
      const chData = fdf.filter(r => r['Sales_Channel'] === drillCh);
      drillPivot = buildPctPivot(chData, 'Customer', tatKey, cats);
      contentHtml += `<div class="drill-down"><h4>Customer Breakdown within Sales Channel</h4>
        <select id="drill-${pfx}">${channels.map(c => `<option value="${esc(c)}" ${c===drillCh?'selected':''}>${esc(c)}</option>`).join('')}</select>
        ${renderPctTable(drillPivot)}
        <div class="chart-wrap"><canvas id="chart-${pfx}-drill"></canvas></div></div>`;
    }
  }

  $('#tab-content').innerHTML = kpiHtml + subHtml + contentHtml;

  document.querySelectorAll('[data-subtab]').forEach(el => { el.onclick = () => { state.activeSubTab[el.dataset.pfx] = el.dataset.subtab; renderTabContent(); }; });
  const drillSel = $(`#drill-${pfx}`);
  if (drillSel) drillSel.onchange = () => { state.drillCh[pfx] = drillSel.value; renderTabContent(); };

  renderStackedChart(`chart-${pfx}`, pivot, cats, colors, `${label} - ${subLabel}`);
  if (drillPivot) renderStackedChart(`chart-${pfx}-drill`, drillPivot, cats, colors, `Customers in ${drillCh}`);
}

function hasStockQty() { return state.rows.length > 0 && 'Stock Qty In Kg' in state.rows[0]; }

function renderPctTable(pivot) {

  return `<div class="table-wrap"><table class="pivot">
    <thead><tr><th></th>${pivot.categories.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead>

function renderStackedChart(id, pivot, cats, colors, title) {
  const canvas = document.getElementById(id); if (!canvas) return;
  if (state.charts[id]) state.charts[id].destroy();
  state.charts[id] = new Chart(canvas.getContext('2d'), {
    type: 'bar',
    data: { labels: pivot.rows.map(r => r.key), datasets: cats.map(c => ({ label: c, data: pivot.rows.map(r => r.pct[c]), backgroundColor: colors[c] })) },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { title: { display: true, text: title, font: { size: 14, weight: 'bold' } }, legend: { position: 'top' }, tooltip: { callbacks: { label: (c) => `${c.dataset.label}: ${c.raw}%` } } },
      scales: { x: { stacked: true }, y: { stacked: true, max: 100, ticks: { callback: (v) => v + '%' } } },
    },
  });
}

function renderBarChart(id, labels, values, dl, color, title) {
  const canvas = document.getElementById(id); if (!canvas) return;
  if (state.charts[id]) state.charts[id].destroy();
  state.charts[id] = new Chart(canvas.getContext('2d'), {
    type: 'bar', data: { labels, datasets: [{ label: dl, data: values, backgroundColor: color }] },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { title: { display: true, text: title, font: { size: 14, weight: 'bold' } }, legend: { display: false }, tooltip: { callbacks: { label: (c) => formatIndian(c.raw) } } },
      scales: { y: { ticks: { callback: (v) => formatIndian(v) } } },
    },
  });
}

let _excelJSLoaded = false;
function loadExcelJS() {
  if (_excelJSLoaded) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';
    s.onload = () => { _excelJSLoaded = true; resolve(); }; s.onerror = reject;
    document.head.appendChild(s);
  });
}

// Column mapping for the RawData sheet (used by formula references)
const RAW_COL = {
  '_dateStr':           'A',
  'From Warehouse':     'B',
  'New MIS Item Group': 'C',
  'Sales_Channel':      'D',
  'Customer':           'E',
  'Dis TAT':            'F',
  'Delivery TAT':       'G',
  'Stock Qty In Kg':    'H',
};
const colLetter = (i) => String.fromCharCode(64 + i); // 1->A, 2->B, ...
const escFormulaStr = (s) => String(s).replace(/"/g, '""');

async function exportExcel() {
  const btn = $('#btn-export');
  btn.disabled = true; btn.innerHTML = '<span class="spinner-sm"></span> Building Excel...';
  try {
    await loadExcelJS();
    const fdf = getFiltered();
    const wb = new ExcelJS.Workbook();

    // 1. Raw data sheet - all pivot formulas reference this
    writeRawDataSheet(wb, fdf);

    // 2. Dispatch TAT pivot sheets with COUNTIFS formulas
    const subs = [['Invoice Date','_dateStr'],['MIS Item Group','New MIS Item Group'],['Sales Channel','Sales_Channel'],['From Warehouse','From Warehouse']];
    for (const [name, col] of subs) {
      const p = buildPctPivot(fdf, col, 'Dis TAT', DISPATCH_CATS);
      writePctSheet(wb, `Dis-${name}`.slice(0,31), p, col, 'Dis TAT');
    }
    // 3. Delivery TAT pivot sheets
    for (const [name, col] of subs) {
      const p = buildPctPivot(fdf, col, 'Delivery TAT', DELIVERY_CATS);
      writePctSheet(wb, `Del-${name}`.slice(0,31), p, col, 'Delivery TAT');
    }
    // 4. MTD pivot sheets with SUMIFS formulas
    if (hasStockQty()) {
      writeSumSingleSheet(wb, 'MTD-Warehouse', buildSumSingle(fdf, 'From Warehouse', 'Stock Qty In Kg'), 'From Warehouse');
      writeSumCrossSheet(wb, 'MTD-SalesChannel', buildSumCross(fdf, 'Sales_Channel', 'From Warehouse', 'Stock Qty In Kg'), 'Sales Channel', 'Sales_Channel');
      writeSumCrossSheet(wb, 'MTD-InvoiceDate', buildSumCross(fdf, '_dateStr', 'From Warehouse', 'Stock Qty In Kg'), 'Invoice Date', '_dateStr');
    }

    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'TAT_MTD_Report.xlsx'; a.click();
    URL.revokeObjectURL(url);
  } catch (e) {
    alert('Export failed: ' + e.message); console.error(e);
  } finally {
    btn.disabled = false; btn.innerHTML = 'Download All Pivots (Excel)';
  }
}

function writeRawDataSheet(wb, data) {
  const ws = wb.addWorksheet('RawData');
  ws.addRow(['Invoice Date', 'From Warehouse', 'New MIS Item Group', 'Sales_Channel', 'Customer', 'Dis TAT', 'Delivery TAT', 'Stock Qty In Kg']).eachCell(styleHeader);
  for (const r of data) {
    const row = ws.addRow([
      r._dateStr || '',
      String(r['From Warehouse'] || ''),
      String(r['New MIS Item Group'] || ''),
      String(r['Sales_Channel'] || ''),
      String(r['Customer'] || ''),
      String(r['Dis TAT'] || ''),
      String(r['Delivery TAT'] || ''),
      Number(r['Stock Qty In Kg']) || 0,
    ]);
    for (let j = 1; j <= 8; j++) {
      const c = row.getCell(j);
      c.border = _border;
      c.alignment = { horizontal: j === 8 ? 'right' : 'left' };
    }
    row.getCell(8).numFmt = '#,##,##0';
  }
  autoFit(ws);
  // Add note row at the top? No, keep data clean for formulas
}

const _hdrFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0A2647' } };
const _rowHdrFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1A5276' } };
const _gtFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFCFE2FF' } };
const _border = { top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'thin' }, right: { style: 'thin' } };

function styleHeader(cell) { cell.font = { bold: true, color: { argb: 'FFFFFFFF' }, size: 11 }; cell.fill = _hdrFill; cell.alignment = { horizontal: 'center', vertical: 'middle' }; cell.border = _border; }
function styleRowHeader(cell) { cell.font = { bold: true, color: { argb: 'FFFFFFFF' }, size: 10 }; cell.fill = _rowHdrFill; cell.alignment = { horizontal: 'left' }; cell.border = _border; }
function styleData(cell) { cell.alignment = { horizontal: 'center' }; cell.border = _border; }
function styleGT(cell) { cell.font = { bold: true, size: 11 }; cell.fill = _gtFill; cell.alignment = { horizontal: 'center' }; cell.border = _border; }

// Percentage pivot with COUNTIFS formulas referencing RawData sheet
function writePctSheet(wb, name, pivot, groupCol, tatCol) {
  const ws = wb.addWorksheet(name);
  const gC = RAW_COL[groupCol];
  const tC = RAW_COL[tatCol];
  ws.addRow(['', ...pivot.categories]).eachCell(styleHeader);
  for (const r of pivot.rows) {
    const row = ws.addRow([r.key]);
    styleRowHeader(row.getCell(1));
    const keyEsc = escFormulaStr(r.key);
    for (let i = 0; i < pivot.categories.length; i++) {
      const cat = pivot.categories[i];
      const catEsc = escFormulaStr(cat);
      const cell = row.getCell(i + 2);
      cell.value = {
        formula: `IFERROR(COUNTIFS(RawData!${gC}:${gC},"${keyEsc}",RawData!${tC}:${tC},"${catEsc}")/COUNTIFS(RawData!${gC}:${gC},"${keyEsc}",RawData!${tC}:${tC},"<>"),0)`,
        result: r.pct[cat] / 100,
      };
      cell.numFmt = '0%';
      styleData(cell);
    }
  }
  // Grand Total row - overall TAT distribution
  const gtRow = ws.addRow(['Grand Total']);
  for (let i = 0; i < pivot.categories.length; i++) {
    const cat = pivot.categories[i];
    const catEsc = escFormulaStr(cat);
    const cell = gtRow.getCell(i + 2);
    cell.value = {
      formula: `IFERROR(COUNTIFS(RawData!${tC}:${tC},"${catEsc}")/COUNTIFS(RawData!${tC}:${tC},"<>"),0)`,
      result: pivot.grandTotal.pct[cat] / 100,
    };
    cell.numFmt = '0%';
  }
  gtRow.eachCell(styleGT);
  autoFit(ws);
}

// Single-column sum pivot with SUMIFS formulas
function writeSumSingleSheet(wb, name, pivot, groupCol) {
  const ws = wb.addWorksheet(name);
  const gC = RAW_COL[groupCol];
  const vC = RAW_COL['Stock Qty In Kg'];
  ws.addRow([groupCol, 'Stock Qty In Kg']).eachCell(styleHeader);
  const firstDataRow = 2;
  for (const r of pivot.rows) {
    const row = ws.addRow([r.key]);
    styleRowHeader(row.getCell(1));
    const keyEsc = escFormulaStr(r.key);
    const cell = row.getCell(2);
    cell.value = {
      formula: `SUMIFS(RawData!${vC}:${vC},RawData!${gC}:${gC},"${keyEsc}")`,
      result: r.value,
    };
    cell.numFmt = '#,##,##0';
    styleData(cell);
  }
  const lastDataRow = ws.rowCount;
  const gt = ws.addRow(['Grand Total']);
  const gtCell = gt.getCell(2);
  gtCell.value = { formula: `SUM(B${firstDataRow}:B${lastDataRow})`, result: pivot.total };
  gtCell.numFmt = '#,##,##0';
  gt.eachCell(styleGT);
  autoFit(ws);
}

// Cross-tab sum pivot with SUMIFS formulas
function writeSumCrossSheet(wb, name, pivot, rowLabel, rowCol) {
  const ws = wb.addWorksheet(name);
  const rC = RAW_COL[rowCol];
  const cC = RAW_COL['From Warehouse'];
  const vC = RAW_COL['Stock Qty In Kg'];
  ws.addRow([rowLabel, ...pivot.cols]).eachCell(styleHeader);
  const firstDataRow = 2;
  const dataColCount = pivot.cols.length; // includes Grand Total at the end
  const lastDataColLetter = colLetter(1 + dataColCount - 1); // last column letter (includes GT)
  const lastNonGTColLetter = colLetter(1 + dataColCount - 1); // GT column is the last; data cols are B..(GT-1)
  for (const r of pivot.rows) {
    const row = ws.addRow([r.key]);
    styleRowHeader(row.getCell(1));
    const keyEsc = escFormulaStr(r.key);
    for (let i = 0; i < pivot.cols.length; i++) {
      const colName = pivot.cols[i];
      const cell = row.getCell(i + 2);
      if (colName === 'Grand Total') {
        // Sum across data columns of this row (excludes itself which is the last col)
        const startLetter = colLetter(2);          // B
        const endLetter = colLetter(1 + i);        // column right before GT
        cell.value = {
          formula: `SUM(${startLetter}${ws.rowCount}:${endLetter}${ws.rowCount})`,
          result: r.values[colName],
        };
      } else {
        const colEsc = escFormulaStr(colName);
        cell.value = {
          formula: `SUMIFS(RawData!${vC}:${vC},RawData!${rC}:${rC},"${keyEsc}",RawData!${cC}:${cC},"${colEsc}")`,
          result: r.values[colName],
        };
      }
      cell.numFmt = '#,##,##0';
      styleData(cell);
    }
  }
  const lastDataRow = ws.rowCount;
  // Grand Total row - sum each column from data rows
  const gtRow = ws.addRow(['Grand Total']);
  for (let i = 0; i < pivot.cols.length; i++) {
    const cell = gtRow.getCell(i + 2);
    const letter = colLetter(2 + i);
    cell.value = {
      formula: `SUM(${letter}${firstDataRow}:${letter}${lastDataRow})`,
      result: pivot.grandTotal.values[pivot.cols[i]],
    };
    cell.numFmt = '#,##,##0';
  }
  gtRow.eachCell(styleGT);
  autoFit(ws);
}

function autoFit(ws) {
  ws.columns.forEach(col => {
    let max = 8;
    col.eachCell?.({ includeEmpty: false }, cell => { const len = String(cell.value ?? '').length; if (len > max) max = len; });
    col.width = Math.min(max + 4, 40);
  });
}

const fileInput = $('#file');
const dropZone = $('#drop-zone');

dropZone.addEventListener('click', () => fileInput.click());

dropZone.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropZone.classList.add('dragover');
});
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});

fileInput.addEventListener('change', e => { if (e.target.files[0]) handleFile(e.target.files[0]); });

$('#reload').addEventListener('click', () => {
  state.rows = []; state.charts = {};
  fileInput.value = '';
  showUpload();
});
</script>
