<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TAT & MTD Dashboard</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.css"
    />
    <style>
      html, body {
        margin: 0; padding: 0; height: 100%; background: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      streamlit-app { display: block; height: 100vh; }
      #loading {
        position: fixed; inset: 0; display: flex;
        flex-direction: column;
        align-items: center; justify-content: center;
        color: #0a2647;
        z-index: 9999;
        background: #fff;
        transition: opacity 0.4s;
        padding: 20px;
        text-align: center;
      }
      #loading h2 { margin: 0 0 0.5rem; font-weight: 700; font-size: 1.3rem; }
      #loading p { margin: 0 0 0.5rem; color: #555; font-size: 0.9rem; max-width: 480px; }
      #loading .progress { margin-top: 1.5rem; font-size: 0.78rem; color: #888; font-family: ui-monospace, monospace; }
      .spinner {
        width: 40px; height: 40px;
        border: 4px solid #e8eef5;
        border-top-color: #0a2647;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        margin-bottom: 1.2rem;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #err {
        display: none;
        margin-top: 1rem; padding: 12px 16px;
        background: #fef2f2; border: 1px solid #fca5a5;
        border-radius: 6px; color: #991b1b; max-width: 520px;
        font-size: 0.85rem; text-align: left;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="spinner"></div>
      <h2>Loading TAT &amp; MTD Dashboard</h2>
      <p>Booting Python runtime in your browser. First load downloads ~15 MB of Python + libraries.</p>
      <p style="font-size: 0.82rem; color: #888;">Typical time: 30-60 seconds on broadband. Cached after first load.</p>
      <div class="progress" id="progress">Initializing...</div>
      <div id="err"></div>
    </div>

    <streamlit-app>
      <app-requirements>
plotly
openpyxl
      </app-requirements>
      <app-file name="streamlit_app.py" url="./streamlit_app.py" entrypoint></app-file>
    </streamlit-app>

    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.js"
    ></script>

    <script>
      const progress = document.getElementById('progress');
      const err = document.getElementById('err');
      const setProgress = (msg) => { if (progress) progress.textContent = msg; };

      setTimeout(() => setProgress('Downloading Pyodide runtime...'), 500);
      setTimeout(() => setProgress('Loading Python packages...'), 8000);
      setTimeout(() => setProgress('Starting Streamlit...'), 20000);

      const hideLoading = () => {
        const loading = document.getElementById('loading');
        if (loading) {
          loading.style.opacity = '0';
          setTimeout(() => loading.remove(), 500);
        }
      };

      const observer = new MutationObserver(() => {
        const app = document.querySelector('streamlit-app');
        if (app && app.shadowRoot && app.shadowRoot.querySelector('iframe')) {
          setTimeout(hideLoading, 1500);
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      // Show error after 3 minutes if still loading
      setTimeout(() => {
        if (document.getElementById('loading')) {
          err.style.display = 'block';
          err.innerHTML = '<strong>Taking longer than expected.</strong><br>' +
            'Open browser DevTools (F12) → Console tab to see any errors. ' +
            'Common causes: slow network, ad-blocker blocking CDN, or corporate proxy.';
        }
      }, 180000);

      window.addEventListener('error', (e) => {
        console.error('Page error:', e);
      });
    </script>
  </body>
</html>
