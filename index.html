<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TAT & MTD Dashboard</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.83.0/build/style.css"
    />
    <style>
      html, body {
        margin: 0; padding: 0; height: 100%; background: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      streamlit-app { display: block; height: 100vh; }
      #loading {
        position: fixed; inset: 0; display: flex;
        flex-direction: column;
        align-items: center; justify-content: center;
        color: #0a2647;
        z-index: 9999;
        background: #fff;
        transition: opacity 0.4s;
      }
      #loading h2 { margin: 0 0 0.5rem; font-weight: 700; font-size: 1.3rem; }
      #loading p { margin: 0; color: #555; font-size: 0.9rem; max-width: 400px; text-align: center; }
      .spinner {
        width: 40px; height: 40px;
        border: 4px solid #e8eef5;
        border-top-color: #0a2647;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        margin-bottom: 1.2rem;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="spinner"></div>
      <h2>Loading TAT &amp; MTD Dashboard</h2>
      <p>Booting Python runtime in your browser... first load takes ~30 seconds. Cached after.</p>
    </div>

    <streamlit-app>
      <app-requirements>
plotly
openpyxl
      </app-requirements>
      <app-file name="streamlit_app.py" url="./streamlit_app.py" entrypoint></app-file>
    </streamlit-app>

    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/@stlite/browser@0.83.0/build/stlite.js"
    ></script>

    <script>
      const hideLoading = () => {
        const loading = document.getElementById('loading');
        if (loading) {
          loading.style.opacity = '0';
          setTimeout(() => loading.remove(), 500);
        }
      };
      const observer = new MutationObserver(() => {
        const app = document.querySelector('streamlit-app');
        if (app && app.shadowRoot && app.shadowRoot.querySelector('iframe')) {
          setTimeout(hideLoading, 1500);
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
      setTimeout(hideLoading, 90000);
    </script>
  </body>
</html>
